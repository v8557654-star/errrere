    <form id="uploadForm">
        <label>Название</label>
        <input type="text" name="title" placeholder="Например: Complementary Shaders" required maxlength="80">

        <label>Описание</label>
        <textarea name="description" placeholder="Расскажи, что это и зачем нужно..." rows="5" required maxlength="1000"></textarea>

        <div class="form-row">
            <div>
                <label>Версия</label>
                <input type="text" name="version" placeholder="1.0.0" required maxlength="20">
            </div>
            <div>
                <label>Версия Minecraft</label>
                <select name="mc_version" required>
                    <option value="">Выбери</option>
                    <option value="1.21.4">1.21.4</option>
            <option value="1.21.3">1.21.3</option>
            <option value="1.21.1">1.21.1</option>
            <option value="1.21">1.21</option>
            <option value="1.20.6">1.20.6</option>
            <option value="1.20.4">1.20.4</option>
            <option value="1.20.2">1.20.2</option>
            <option value="1.20.1">1.20.1</option>
            <option value="1.19.4">1.19.4</option>
            <option value="1.19.2">1.19.2</option>
            <option value="1.18.2">1.18.2</option>
            <option value="1.17.1">1.17.1</option>
            <option value="1.16.5">1.16.5</option>
            <option value="1.12.2">1.12.2</option>
            <option value="1.8.9">1.8.9</option>
            <option value="1.7.10">1.7.10</option>
                </select>
            </div>
            <div>
                <label>Загрузчик (Loader)</label>
                <select name="loader" required>
                    <option value="">Выбери</option>
                    <option value="Forge">Forge</option>
                    <option value="Fabric">Fabric</option>
                    <option value="Quilt">Quilt</option>
                    <option value="NeoForge">NeoForge</option>
                    <option value="Vanilla">Vanilla</option>
                </select>
            </div>
        </div>

        <label>Категория</label>
        <select name="category" required>
            <option value="">Выбери категорию</option>
            <option value="Магия">Магия</option>
            <option value="Техника">Техника</option>
            <option value="Оружие">Оружие</option>
            <option value="Мобы">Мобы</option>
            <option value="Декор">Декор</option>
            <option value="Еда">Еда</option>
            <option value="Миры">Миры</option>
            <option value="Утилиты">Утилиты</option>
            <option value="Другое">Другое</option>
        </select>

        <label>Теги (через запятую)</label>
        <input type="text" name="tags" placeholder="реализм, оптимизация, RTX, ванильный" maxlength="120">

        <label class="file-label">
            <div class="file-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
            <div class="file-text">Выбери файл мода</div>
            <div class="file-hint">Демо-режим: файл не отправляется на сервер</div>
            <input type="file" name="mod_file">
        </label>

        <label><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Скриншоты (необязательно, до 5)</label>
        <div class="screenshots-upload">
            <label class="ss-upload-box"><span>📷 1</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 2</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 3</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 4</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 5</span><input type="file" accept="image/*"></label>
        </div>

        <button type="submit"><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Опубликовать</button>
    </form>
</div>

<script>
document.addEventListener('click', function(e) {
    var sidebar = document.querySelector('.sidebar');
    var toggle = document.querySelector('.mobile-menu-toggle');
    if (window.innerWidth <= 900 && sidebar.classList.contains('open')
        && !sidebar.contains(e.target) && e.target !== toggle) {
        sidebar.classList.remove('open');
    }
    var dropdown = document.querySelector('.user-dropdown');
    var menuBtn = document.querySelector('.user-menu-btn');
    if (dropdown && dropdown.classList.contains('open') && menuBtn
        && !dropdown.contains(e.target) && !menuBtn.contains(e.target)) {
        dropdown.classList.remove('open');
    }
});
</script>
