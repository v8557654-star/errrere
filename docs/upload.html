<!DOCTYPE html>
<html lang="ru" data-theme="green" data-animations="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MineMods — лучшая платформа для поиска и загрузки модов для Minecraft">
    <meta name="theme-color" content="#22ff88">
    <title>Загрузить мод — MineMods</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛏%3C/text%3E%3C/svg%3E">
    <script>(function(){function g(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
    var h=document.documentElement;h.setAttribute('data-theme',g('mm_theme','green'));
    h.setAttribute('data-animations',g('mm_animations','on')==='off'?'off':'on');})();</script>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/static-site.css">
    <link rel="preconnect" href="https://api.modrinth.com">
    <link rel="preconnect" href="https://api.github.com">
</head>
<body data-page="upload" data-protected="1">
<a href="#main-content" class="skip-link">Перейти к основному контенту</a>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo">
                <span class="logo-icon">⛏</span>
                <span class="logo-text">MineMods</span>
            </a>
        </div>
        <nav class="sidebar-nav" role="navigation" aria-label="Боковая навигация">
            <a href="index.html" class="nav-item"><span class="nav-icon" aria-hidden="true">🏠</span><span>Каталог</span></a>
            <a href="news.html" class="nav-item"><span class="nav-icon" aria-hidden="true">📰</span><span>Новости</span></a>
            <a href="modrinth.html" class="nav-item"><span class="nav-icon" aria-hidden="true">🌍</span><span>Modrinth</span></a>
            <a href="github.html" class="nav-item"><span class="nav-icon" aria-hidden="true">🦊</span><span>GitHub</span></a>
            <a href="feed.html" style="display:none" class="nav-item auth-only"><span class="nav-icon" aria-hidden="true">📡</span><span>Подписки</span></a>
            <a href="favorites.html" style="display:none" class="nav-item auth-only"><span class="nav-icon" aria-hidden="true">❤️</span><span>Избранное</span></a>
            <a href="upload.html" style="display:none" class="nav-item auth-only"><span class="nav-icon" aria-hidden="true">📤</span><span>Загрузить</span></a>
            <a href="achievements.html" style="display:none" class="nav-item auth-only"><span class="nav-icon" aria-hidden="true">🏅</span><span>Достижения</span></a>
        </nav>
        <div class="sidebar-footer" id="sidebarAuth"></div>
    </aside>

    <main class="main-content" id="main-content">
        <header class="topbar" role="banner">
            <button class="mobile-menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')" aria-label="Меню">☰</button>
            <div class="topbar-right" id="topbarRight" role="navigation" aria-label="Основная навигация"></div>
        </header>

        <div class="container">
            <div id="pageContent">

<div class="form-page form-wide">
    <div class="form-icon">📤</div>
    <h2>Загрузить контент</h2>
    <p class="form-subtitle">Поделись модом, шейдером, картой и др.</p>

    <div class="upload-type-tabs">
        <a href="upload.html?type=mod" class="ut-tab" data-type="mod"><span class="ut-icon">⛏</span><span class="ut-name">Мод</span><span class="ut-ext">.jar</span></a>
        <a href="upload.html?type=shader" class="ut-tab" data-type="shader"><span class="ut-icon">🌅</span><span class="ut-name">Шейдер</span><span class="ut-ext">.zip</span></a>
        <a href="upload.html?type=plugin" class="ut-tab" data-type="plugin"><span class="ut-icon">🔌</span><span class="ut-name">Плагин</span><span class="ut-ext">.jar</span></a>
        <a href="upload.html?type=resourcepack" class="ut-tab" data-type="resourcepack"><span class="ut-icon">🎨</span><span class="ut-name">Ресурспак</span><span class="ut-ext">.zip</span></a>
        <a href="upload.html?type=modpack" class="ut-tab" data-type="modpack"><span class="ut-icon">📦</span><span class="ut-name">Сборка</span><span class="ut-ext">.zip / .mrpack</span></a>
        <a href="upload.html?type=datapack" class="ut-tab" data-type="datapack"><span class="ut-icon">📝</span><span class="ut-name">Датапак</span><span class="ut-ext">.zip</span></a>
        <a href="upload.html?type=map" class="ut-tab" data-type="map"><span class="ut-icon">🗺️</span><span class="ut-name">Карта</span><span class="ut-ext">.zip</span></a>
    </div>

    <form id="uploadForm">
        <label>Название</label>
        <input type="text" name="title" placeholder="Например: Complementary Shaders" required maxlength="80">

        <label>Описание</label>
        <textarea name="description" placeholder="Расскажи, что это и зачем нужно..." rows="5" required maxlength="1000"></textarea>

        <div class="form-row">
            <div>
                <label>Версия</label>
                <input type="text" name="version" placeholder="1.0.0" required maxlength="20">
            </div>
            <div>
                <label>Версия Minecraft</label>
                <select name="mc_version" required>
                    <option value="">Выбери</option>
                    <option value="1.21.4">1.21.4</option>
            <option value="1.21.3">1.21.3</option>
            <option value="1.21.1">1.21.1</option>
            <option value="1.21">1.21</option>
            <option value="1.20.6">1.20.6</option>
            <option value="1.20.4">1.20.4</option>
            <option value="1.20.2">1.20.2</option>
            <option value="1.20.1">1.20.1</option>
            <option value="1.19.4">1.19.4</option>
            <option value="1.19.2">1.19.2</option>
            <option value="1.18.2">1.18.2</option>
            <option value="1.17.1">1.17.1</option>
            <option value="1.16.5">1.16.5</option>
            <option value="1.12.2">1.12.2</option>
            <option value="1.8.9">1.8.9</option>
            <option value="1.7.10">1.7.10</option>
                </select>
            </div>
            <div>
                <label>Загрузчик (Loader)</label>
                <select name="loader" required>
                    <option value="">Выбери</option>
                    <option value="Forge">Forge</option>
                    <option value="Fabric">Fabric</option>
                    <option value="Quilt">Quilt</option>
                    <option value="NeoForge">NeoForge</option>
                    <option value="Vanilla">Vanilla</option>
                </select>
            </div>
        </div>

        <label>Категория</label>
        <select name="category" required>
            <option value="">Выбери категорию</option>
            <option value="Магия">Магия</option>
            <option value="Техника">Техника</option>
            <option value="Оружие">Оружие</option>
            <option value="Мобы">Мобы</option>
            <option value="Декор">Декор</option>
            <option value="Еда">Еда</option>
            <option value="Миры">Миры</option>
            <option value="Утилиты">Утилиты</option>
            <option value="Другое">Другое</option>
        </select>

        <label>Теги (через запятую)</label>
        <input type="text" name="tags" placeholder="реализм, оптимизация, RTX, ванильный" maxlength="120">

        <label class="file-label">
            <div class="file-icon">📁</div>
            <div class="file-text">Выбери файл мода</div>
            <div class="file-hint">Демо-режим: файл не отправляется на сервер</div>
            <input type="file" name="mod_file">
        </label>

        <label>📸 Скриншоты (необязательно, до 5)</label>
        <div class="screenshots-upload">
            <label class="ss-upload-box"><span>📷 1</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 2</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 3</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 4</span><input type="file" accept="image/*"></label>
            <label class="ss-upload-box"><span>📷 5</span><input type="file" accept="image/*"></label>
        </div>

        <button type="submit">🚀 Опубликовать</button>
    </form>
</div>

            </div>
        </div>
    </main>
</div>

<script>
document.addEventListener('click', function(e) {
    var sidebar = document.querySelector('.sidebar');
    var toggle = document.querySelector('.mobile-menu-toggle');
    if (window.innerWidth <= 900 && sidebar.classList.contains('open')
        && !sidebar.contains(e.target) && e.target !== toggle) {
        sidebar.classList.remove('open');
    }
    var dropdown = document.querySelector('.user-dropdown');
    var menuBtn = document.querySelector('.user-menu-btn');
    if (dropdown && dropdown.classList.contains('open') && menuBtn
        && !dropdown.contains(e.target) && !menuBtn.contains(e.target)) {
        dropdown.classList.remove('open');
    }
});
</script>
<script src="static/js/main.js"></script>
<script src="static/js/site.js"></script>

</body>
</html>
